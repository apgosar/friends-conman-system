name: neev-cms

# On-prem deployment stack: app + local Postgres + MinIO (self-hosted S3) +
# Cloudflare Tunnel. No ports are published to the host — cloudflared is the
# only path in, so there is nothing to port-forward or scan from outside.
#
# `web` carries both `build:` and `image:`. Real customer deployments should
# only ever run `docker compose pull` (uses `image:`, requires `docker login
# ghcr.io` first — see README.md) and never `docker compose build`, so the
# server only ever sees a pre-built image and never this repo's source.
# `build:` exists purely for local testing of this stack.
#
# Usage (real deployment — pull, never build):
#   cd deploy/onprem
#   cp .env.onprem.example .env
#   # fill in secrets, including IMAGE_TAG
#   docker login ghcr.io -u <github-username>   # once, or when rotating the token
#   docker compose pull
#   docker compose up -d
#   docker compose exec web npx prisma migrate deploy
#
# Usage (local testing — build from source instead):
#   docker compose build
#   docker compose up -d

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ghcr.io/apgosar/friends-conman-system:${IMAGE_TAG:-latest}
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neev_cms}
      POSTGRES_USER: ${POSTGRES_USER:-neev_cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neev_cms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # One-shot job: creates the document bucket on first boot. MinIO doesn't
  # auto-create buckets, and app startup doesn't have permission to.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$AWS_S3_BUCKET
      "
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  minio-data:
