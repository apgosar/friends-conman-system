name: neev-cms

# On-prem deployment stack: app + local Postgres + Cloudflare Tunnel. Uploaded
# documents live in the `files` volume. No ports are published to the host —
# cloudflared is the only path in, so there is nothing to port-forward or scan
# from outside.
# (Servers installed before v0.0.42 also ran MinIO; switch-to-local-storage.sh
# moves them over.)
#
# `web` carries both `build:` and `image:`. Real customer deployments should
# only ever run `docker compose pull` (uses `image:`, requires `docker login
# ghcr.io` first — see README.md) and never `docker compose build`, so the
# server only ever sees a pre-built image and never this repo's source.
# `build:` exists purely for local testing of this stack.
#
# Usage (real deployment — pull, never build):
#   cd deploy/onprem
#   cp .env.onprem.example .env
#   # fill in secrets, including IMAGE_TAG
#   docker login ghcr.io -u <github-username>   # once, or when rotating the token
#   docker compose pull
#   docker compose up -d
#   docker compose exec web npx prisma migrate deploy
#
# Usage (local testing — build from source instead):
#   docker compose build
#   docker compose up -d

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ghcr.io/apgosar/friends-conman-system:${IMAGE_TAG:-latest}
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # Uploaded documents (.env: STORAGE_PROVIDER=local, LOCAL_STORAGE_DIR=/data/files). The only
    # writable place in the container; the volume is owned by the app's user (see the Dockerfile).
    volumes:
      - files:/data/files
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neev_cms}
      POSTGRES_USER: ${POSTGRES_USER:-neev_cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neev_cms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  files:
