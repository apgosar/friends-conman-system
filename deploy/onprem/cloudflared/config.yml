# Cloudflare Tunnel config — generated interactively, this file is a template.
#
# <customer-slug>: a short identifier for this customer (e.g. "acme"), just
# so multiple customers' tunnels are distinguishable in your Cloudflare
# dashboard — it has no other technical meaning.
#
# <your-domain>: YOUR domain, not the customer's. The customer doesn't need
# to own one — Cloudflare Tunnel routes DNS.
#   cloudflared tunnel route dns` needs a zone (domain) added to your own
# Cloudflare account, and every customer just gets a subdomain under it
# (<customer-slug>.<your-domain>). Nothing below requires the customer to
# have any domain of their own.
#
# One-time setup (run on your machine, not the customer's server):
#   cloudflared tunnel login
#   cloudflared tunnel create neev-cms-<customer-slug>
#   cloudflared tunnel route dns neev-cms-<customer-slug> <customer-slug>.<your-domain>
#
# The `create` step writes a credentials JSON file (e.g. <TUNNEL_ID>.json) —
# copy it into this same deploy/onprem/cloudflared/ directory and reference
# it below. Never commit that credentials file to git.

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  # Routes straight to the app container over the internal Docker network —
  # the web service publishes no host port, so this tunnel is the only path in.
  - hostname: <customer-slug>.<your-domain>
    service: http://web:8080
  - service: http_status:404
