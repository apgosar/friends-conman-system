name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: neev-cms # Update if your GCP Project ID differs
  REGION: asia-south1
  GAR_LOCATION: asia-south1
  SERVICE_NAME: neev-cms
  # The Workload Identity Provider created in GCP
  # e.g., projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  # The Service Account created in GCP that has permissions to deploy
  SERVICE_ACCOUNT: ${{ secrets.SA_EMAIL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Required for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"

          # We pass standard build args here if needed.
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          # Resolve the immutable digest of what we just pushed — cosign signs
          # the digest, not the mutable tag, so the signature can't be silently
          # detached by something else later pushing a different image to the same tag.
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        run: cosign sign --yes "${{ env.IMAGE_DIGEST }}"
        # Keyless signing: cosign gets a short-lived certificate from Sigstore's
        # Fulcio CA using this job's GitHub OIDC token (the `id-token: write`
        # permission above), tying the signature to "this exact workflow file,
        # on this exact repo, on this exact commit" — no signing key to
        # generate, store as a secret, or ever rotate. The signature and a
        # transparency-log entry are published to Rekor (public, timestamped,
        # tamper-evident) and attached to the image in the registry.
        #
        # Verify later with:
        #   cosign verify "$IMAGE_DIGEST" \
        #     --certificate-identity "https://github.com/apgosar/friends-conman-system/.github/workflows/deploy.yml@refs/heads/main" \
        #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
        # A tampered or independently-rebuilt image (e.g. one a customer relabeled
        # after `docker exec`-ing into a running container) has a different
        # digest and no matching signature, so this fails.

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          # Use --allow-unauthenticated if this is a public dashboard
          # Ensure env vars (like DATABASE_URL from Supabase) are set in Cloud Run directly.

      - name: Show Output
        run: echo "Service deployed at ${{ steps.deploy.outputs.url }}"
