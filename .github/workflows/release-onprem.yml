name: Release on-prem image

# Deliberately separate from deploy.yml (which auto-deploys every push to
# main to Cloud Run). On-prem customers should never auto-follow main —
# this only runs when you push a semver git tag, i.e. when you've decided
# a specific commit is ready to hand to a customer's server. See
# DEPLOYMENT_ONPREM.md and the "managing cloud + on-prem from one
# codebase" discussion for why: cloud tracks latest, on-prem is pinned
# per-customer to a tag you promote deliberately.
#
# Usage: git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A customer image is only built from a commit that passes the quality gate.
  verify:
    uses: ./.github/workflows/ci.yml

  # The image is built while the checks run, so the release does not wait for it afterwards. Nothing is published here: only
  # the build layers are kept (in the registry, as the "buildcache" tag), and the release job below pushes the image once
  # the checks have passed.
  image:
    name: Build image (while the checks run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the layer cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  release:
    needs: [verify, image]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build as above, so every layer comes from the cache and only the push is left
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false # one plain image, as before (no attestation manifest next to it)
          # The app shows the release tag and commit, and /api/health returns them (see next.config.ts).
          # The image has no .git to read them from, so they are passed in.
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache

      - name: Note the image and its digest
        # Signed by digest, not the mutable tag: see deploy.yml for why.
        run: |
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_ENV
          echo "IMAGE_DIGEST=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> $GITHUB_ENV

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        run: cosign sign --yes "${{ env.IMAGE_DIGEST }}"
        # Verify with (note: tag-triggered, so the ref in the identity varies
        # per release — use a regexp, not an exact --certificate-identity):
        #   cosign verify "<image>@sha256:<digest>" \
        #     --certificate-identity-regexp "^https://github.com/apgosar/friends-conman-system/\.github/workflows/release-onprem\.yml@refs/tags/.*$" \
        #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Show output
        run: echo "Released ${{ env.IMAGE }}"
